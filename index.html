<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Logo Blaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet — HUD strip, playfield canvas, logo loaders below. Single dark look by choice. */
:root{
  --bg:#0b0a14; --panel:#15132a; --line:#2c2850;
  --fg:#e8e6ff; --muted:#8e89c2; --accent:#ffcc2e; --hot:#ff4f7a; --cool:#3ee6d0;
  --display:"Silkscreen", "Courier New", monospace;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);margin:0}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:.04em;color:var(--accent);text-shadow:2px 2px 0 var(--hot)}
.hud{display:flex;gap:14px;font-family:var(--display);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--fg);font-weight:400}
.stage{position:relative;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:color-mix(in srgb,var(--bg) 78%,transparent);padding-inline:16px}
.overlay h2{font-family:var(--display);font-size:1.6rem;margin:0;color:var(--accent);text-wrap:balance}
.overlay p{margin:0;color:var(--muted);font-size:.85rem;max-width:30ch;line-height:1.5}
button,.file{font-family:var(--display);font-size:.9rem;border:2px solid var(--accent);background:var(--accent);color:var(--bg);padding:10px 18px;border-radius:4px;cursor:pointer}
button:focus-visible,.file:focus-within{outline:2px solid var(--cool);outline-offset:3px}
.pad{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.ctl{font-size:1.6rem;padding-block:18px;padding-inline:0;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:10px;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.ctl.fire{font-size:1.1rem;background:var(--hot);border-color:var(--hot);color:var(--fg)}
.ctl.on{transform:translateY(2px);border-color:var(--accent)}
.ctl.fire.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.loaders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{flex-direction:column;text-align:center}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;min-width:0}
.thumb{width:44px;height:44px;flex:none;border-radius:4px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.slot .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.file{font-size:.7rem;padding:6px 10px;background:transparent;color:var(--accent);display:inline-block;text-align:center}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.hint{font-size:.75rem;color:var(--muted);margin:0;line-height:1.5}
@media (max-width:340px){.loaders{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.overlay{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>LOGO BLASTER</h1>
    <div class="hud">
      <span>PTS <b id="score">0</b></span>
      <span>OLA <b id="wave">1</b></span>
      <span>VIDAS <b id="lives">3</b></span>
      <span>MAX <b id="best">0</b></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">¿LISTO?</h2>
      <p id="ovText">Mové con ◀ ▶ y mantené FUEGO para disparar. En compu: flechas y espacio.</p>
      <button id="startBtn" type="button">JUGAR</button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button type="button" class="ctl" data-k="ArrowLeft" aria-label="Mover a la izquierda">◀</button>
    <button type="button" class="ctl" data-k="ArrowRight" aria-label="Mover a la derecha">▶</button>
    <button type="button" class="ctl fire" data-k="fire" aria-label="Disparar">FUEGO</button>
  </div>

  <div class="loaders">
    <div class="slot">
      <div class="thumb" id="thumbP"></div>
      <div class="meta">
        <span class="lbl">Ruibal (abajo)</span>
        <label class="file">CARGAR<input id="fileP" type="file" accept="image/*"></label>
      </div>
    </div>
    <div class="slot">
      <div class="thumb" id="thumbE"></div>
      <div class="meta">
        <span class="lbl">Maldón</span>
        <label class="file">CARGAR<input id="fileE" type="file" accept="image/*"></label>
      </div>
    </div>
    <div class="slot">
      <div class="thumb" id="thumbF"></div>
      <div class="meta">
        <span class="lbl">Buró</span>
        <label class="file">CARGAR<input id="fileF" type="file" accept="image/*"></label>
      </div>
    </div>
  </div>
  <p class="hint">Usá PNG con fondo transparente para que quede mejor. Los logos se guardan en este navegador.</p>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
const ov=$('ov'),ovTitle=$('ovTitle'),ovText=$('ovText'),startBtn=$('startBtn');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let W=400,H=600,dpr=1;
function resize(){
  W=stage.clientWidth;
  const avail=window.innerHeight-200;
  H=Math.max(380,Math.min(Math.round(W*1.45),avail));
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(player) player.y=H-48;
}

// Logos
const logos={P:null,E:null,F:null};
function setLogo(which,src){
  const img=new Image();
  img.onload=()=>{logos[which]=img;const t=$('thumb'+which);t.innerHTML='';const c=img.cloneNode();t.appendChild(c)};
  img.src=src;
}
function loadFile(which,file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    // downscale to keep storage small
    const img=new Image();
    img.onload=()=>{
      const s=128/Math.max(img.width,img.height),c=document.createElement('canvas');
      c.width=Math.round(img.width*Math.min(1,s));c.height=Math.round(img.height*Math.min(1,s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const url=c.toDataURL('image/png');setLogo(which,url);store.set('lb_logo_'+which,url);
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
$('fileP').addEventListener('change',e=>loadFile('P',e.target.files[0]));
$('fileE').addEventListener('change',e=>loadFile('E',e.target.files[0]));
$('fileF').addEventListener('change',e=>loadFile('F',e.target.files[0]));

function drawLogo(img,x,y,size){
  const r=Math.min(size/img.width,size/img.height),w=img.width*r,h=img.height*r;
  ctx.drawImage(img,x-w/2,y-h/2,w,h);
}
function drawDefaultPlayer(x,y,s){
  ctx.fillStyle='#ffcc2e';ctx.beginPath();
  ctx.moveTo(x,y-s/2);ctx.lineTo(x+s/2,y+s/2);ctx.lineTo(x,y+s/4);ctx.lineTo(x-s/2,y+s/2);ctx.closePath();ctx.fill();
}
function drawDefaultEnemy(x,y,s,t,k){
  ctx.fillStyle=k==='F'?'#3ee6d0':'#ff4f7a';
  const p=s/8;const legs=Math.floor(t/300)%2;
  const rows=['..X..X..','...XX...','.XXXXXX.','XX.XX.XX','XXXXXXXX',legs?'.X....X.':'X......X'];
  rows.forEach((r,j)=>{for(let i=0;i<8;i++) if(r[i]==='X') ctx.fillRect(x-s/2+i*p,y-s/2+j*p+p,p,p)});
}

// Game state
let player,bullets,eBullets,enemies,particles,stars,score,lives,wave,best,state='idle',lastShot=0,dir=1,invuln=0,last=0;
best=+store.get('lb_best')||0;$('best').textContent=best;
const keys={};

function makeStars(){stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,v:10+Math.random()*40}))}
function spawnWave(){
  enemies=[];
  const cols=Math.max(5,Math.min(8,Math.floor(W/56))),rows=Math.min(3+Math.floor(wave/2),6);
  const size=Math.min(40,(W-40)/cols-10),gap=size+10,offX=(W-cols*gap)/2+gap/2;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    enemies.push({x:offX+c*gap,y:60+r*(size+8),s:size,hp:1,k:r%2?'F':'E'});
  dir=1;
}
function reset(){
  player={x:W/2,y:H-48,s:46,tx:W/2};
  bullets=[];eBullets=[];particles=[];score=0;lives=3;wave=1;invuln=0;
  makeStars();spawnWave();hud();
}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('wave').textContent=wave;$('best').textContent=best}
function burst(x,y,color,n=14){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6,color})}}

function showOverlay(t,txt,btn){ovTitle.textContent=t;ovText.textContent=txt;startBtn.textContent=btn;ov.hidden=false}
startBtn.addEventListener('click',()=>{reset();state='play';ov.hidden=true;startBtn.blur()});

// Input
function pointerX(e){const r=cv.getBoundingClientRect();return e.clientX-r.left}
stage.addEventListener('pointerdown',e=>{if(state==='play'){player.tx=pointerX(e);stage.setPointerCapture(e.pointerId)}});
stage.addEventListener('pointermove',e=>{if(state==='play'&&(e.buttons||e.pointerType!=='mouse')) player.tx=pointerX(e); else if(state==='play'&&e.pointerType==='mouse') player.tx=pointerX(e)});
addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key)&&state==='play')e.preventDefault();if(e.key==='Enter'&&state!=='play')startBtn.click()});
addEventListener('keyup',e=>{keys[e.key]=false});
document.querySelectorAll('.ctl').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

function update(dt,t){
  for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
  if(state!=='play') return;

  // move player
  const spd=Math.max(420,W*1.4);
  const mv=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  if(mv){player.x+=mv*spd*dt;player.tx=player.x}
  else player.x+=(player.tx-player.x)*Math.min(1,dt*18);
  player.x=Math.max(player.s/2,Math.min(W-player.s/2,player.x));
  player.tx=Math.max(player.s/2,Math.min(W-player.s/2,player.tx));

  // auto-fire
  const rate=Math.max(160,280-wave*12);
  if((keys.fire||keys[' '])&&t-lastShot>rate){bullets.push({x:player.x,y:player.y-player.s/2});lastShot=t}
  for(const b of bullets) b.y-=520*dt;
  bullets=bullets.filter(b=>b.y>-10);

  // enemies march
  const speed=(30+wave*12)*(1+(1-enemies.length/40)*0.8);
  let edge=false;
  for(const e of enemies){e.x+=dir*speed*dt;if(e.x<e.s/2+6||e.x>W-e.s/2-6)edge=true}
  if(edge){dir*=-1;for(const e of enemies){e.y+=16;e.x+=dir*speed*dt}}

  // enemy fire
  if(enemies.length&&Math.random()<dt*(0.6+wave*0.25)){
    const sh=enemies[Math.floor(Math.random()*enemies.length)];
    eBullets.push({x:sh.x,y:sh.y+sh.s/2});
  }
  for(const b of eBullets) b.y+=(200+wave*15)*dt;
  eBullets=eBullets.filter(b=>b.y<H+10);

  // hits on enemies
  for(const b of bullets)for(const e of enemies){
    if(!b.dead&&!e.dead&&Math.abs(b.x-e.x)<e.s/2&&Math.abs(b.y-e.y)<e.s/2){
      b.dead=e.dead=true;score+=10*wave;burst(e.x,e.y,'#ff4f7a');
    }
  }
  bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead);

  // hits on player
  if(invuln>0) invuln-=dt;
  const hitP=b=>Math.abs(b.x-player.x)<player.s/2.4&&Math.abs(b.y-player.y)<player.s/2.4;
  for(const b of eBullets) if(invuln<=0&&hitP(b)){b.dead=true;hurt()}
  eBullets=eBullets.filter(b=>!b.dead);
  for(const e of enemies) if(e.y+e.s/2>=player.y-player.s/2){lives=1;hurt();break}

  if(state==='play'&&!enemies.length){wave++;eBullets=[];spawnWave()}
  if(score>best){best=score;store.set('lb_best',best)}
  hud();
}
function hurt(){
  lives--;invuln=1.6;burst(player.x,player.y,'#ffcc2e',24);
  if(lives<=0){state='over';hud();showOverlay('GAME OVER',`Hiciste ${score} puntos y llegaste a la ola ${wave}.`,'OTRA VEZ')}
}

function draw(t){
  ctx.fillStyle='#0b0a14';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8e89c2';
  for(const s of stars){ctx.globalAlpha=s.v/60;ctx.fillRect(s.x,s.y,2,2)}
  ctx.globalAlpha=1;
  if(!enemies) return;
  for(const e of enemies){const img=logos[e.k]||logos.E||logos.F;img?drawLogo(img,e.x,e.y,e.s):drawDefaultEnemy(e.x,e.y,e.s,t,e.k)}
  ctx.fillStyle='#3ee6d0';for(const b of bullets) ctx.fillRect(b.x-2,b.y-8,4,12);
  ctx.fillStyle='#ff4f7a';for(const b of eBullets) ctx.fillRect(b.x-2,b.y-4,4,10);
  if(state!=='over'&&!(invuln>0&&Math.floor(t/100)%2)) logos.P?drawLogo(logos.P,player.x,player.y,player.s):drawDefaultPlayer(player.x,player.y,player.s);
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
  // ground line
  ctx.fillStyle='#2c2850';ctx.fillRect(0,H-14,W,2);
}

function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  update(dt,t);draw(t);requestAnimationFrame(loop);
}

resize();reset();state='idle';
addEventListener('resize',()=>{const fx=player?player.x/W:.5;resize();makeStars();if(state!=='play'){spawnWave()} if(player){player.x=player.tx=fx*W}});
requestAnimationFrame(loop);
})();
</script>
